    .title, .heading, .name { fill: #f0efec }
    .muted { fill: #c3c2b7 }
    .axis { stroke: #52514e }
    .s1 { fill: #3987e5 } .s2 { fill: #d95926 } .s3 { fill: #199e70 } .s4 { fill: #9085e9 }
  }
</style>

