<svg xmlns="http://www.w3.org/2000/svg" width="912" height="444" viewBox="0 0 912 444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<style>
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b }
  .heading { font-weight: 600; fill: #0b0b0b }
  .name { fill: #0b0b0b }
  .muted { fill: #52514e }
  .axis { stroke: #c3c2b7; stroke-width: 1 }
  .s1 { fill: #2a78d6 } .s2 { fill: #eb6834 } .s3 { fill: #1baf7a } .s4 { fill: #6250d6 }
